# nginx for the production web image (nginx-unprivileged listens on 8080). The API is reached by the name `api` on the same network;
# change the upstream if your platform names it differently.
#
# STATUS: written but NOT RUN. Points that matter and that someone must check on a real deployment:
#  * TLS terminates in front of this container (a load balancer or ingress). Pass X-Forwarded-Proto and configure
#    Security:ForwardedHeaders on the API to trust THIS proxy's address (docs/architecture/23-proxy-rate-limiting-and-simulator-isolation.md).
#  * Host is forwarded as the browser sent it (`$http_host`, with port): the SignalR hub refuses a browser whose Origin does not match
#    the Host it arrives for.
#  * /hubs/ needs the WebSocket upgrade headers and a read timeout above the hub's keep-alive (15 s) and client timeout (45 s).
#  * No Content-Security-Policy is set here: choosing one (and allowing the payment providers' hosted pages and Stripe/Paymob return
#    redirects) is a security decision for the owner. The headers below are the ones that are safe for any deployment.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pulsereserve_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://pulsereserve_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /hubs/ {
        proxy_pass http://pulsereserve_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hashed build assets never change: cache them hard. index.html must always be revalidated.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
