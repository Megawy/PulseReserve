# Local development stack: PostgreSQL + API (dotnet watch) + Angular dev server (HMR).
# Start:  docker compose -f compose.dev.yaml up -d --build      (see docs/DEVELOPMENT.md)
# Stop:   docker compose -f compose.dev.yaml stop               (data volume is kept; never use `down -v` casually)
name: pulsereserve-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsereserve}
      POSTGRES_USER: ${POSTGRES_USER:-pulsereserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/dev setup first (creates .env from .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Intentionally no published port: only the api container needs the database.

  api:
    build:
      context: .
      dockerfile: docker/api.dev.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=${POSTGRES_DB:-pulsereserve};Username=${POSTGRES_USER:-pulsereserve};Password=${POSTGRES_PASSWORD}
      Logging__LogLevel__Default: Information
      Database__MigrateOnStartup: "true"
      Identity__AdminUserIds: ${ADMIN_USER_IDS:-}
      # The simulator and a real provider are alternatives: the API refuses to start with both. Set SIMULATOR_ENABLED=false in .env
      # when you enable Stripe or Paymob below (see .env.example).
      Payments__Simulator__Enabled: ${SIMULATOR_ENABLED:-true}
      Notifications__DevAdapter__Enabled: "true"
      # Real-time updates (SignalR hub /hubs/live) and the proactive hold-expiry worker; see docs/architecture/28-real-time-architecture.md.
      Live__Enabled: ${LIVE_ENABLED:-true}
      Reservation__HoldExpiry__Enabled: ${HOLD_EXPIRY_ENABLED:-true}
      # Real providers are OFF unless enabled in .env (see .env.example); by default the simulator is used.
      Payments__Stripe__Enabled: ${STRIPE_ENABLED:-false}
      Payments__Stripe__Mode: ${STRIPE_MODE:-Test}
      Payments__Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Payments__Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Payments__Stripe__AllowedCurrencies: ${STRIPE_ALLOWED_CURRENCIES:-}
      Payments__Stripe__ReturnBaseUrl: ${STRIPE_RETURN_BASE_URL:-http://localhost:4200}
      Payments__Paymob__Enabled: ${PAYMOB_ENABLED:-false}
      Payments__Paymob__Mode: ${PAYMOB_MODE:-Test}
      Payments__Paymob__SecretKey: ${PAYMOB_SECRET_KEY:-}
      Payments__Paymob__PublicKey: ${PAYMOB_PUBLIC_KEY:-}
      Payments__Paymob__HmacSecret: ${PAYMOB_HMAC_SECRET:-}
      Payments__Paymob__IntegrationIds: ${PAYMOB_INTEGRATION_IDS:-}
      Payments__Paymob__AllowedCurrencies: ${PAYMOB_ALLOWED_CURRENCIES:-EGP}
      Payments__Paymob__ReturnBaseUrl: ${PAYMOB_RETURN_BASE_URL:-http://localhost:4200}
      Payments__Paymob__PublicApiBaseUrl: ${PAYMOB_PUBLIC_API_BASE_URL:-}
    volumes:
      - ./src:/workspace/src
      - ./Directory.Build.props:/workspace/Directory.Build.props:ro
      - ./Directory.Packages.props:/workspace/Directory.Packages.props:ro
      - ./global.json:/workspace/global.json:ro
      - api-artifacts:/artifacts
      - nuget-cache:/nuget
    ports:
      - "${API_PORT:-5080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.dev.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server-side proxy target (compose service name). The browser only ever talks to the web origin: /api is proxied.
      PULSERESERVE_API_URL: http://api:8080
    volumes:
      - ./frontend/pulsereserve-web:/app
      - web-node-modules:/app/node_modules
      - web-angular-cache:/app/.angular
    ports:
      - "${WEB_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4200/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

volumes:
  pgdata:
  api-artifacts:
  nuget-cache:
  web-node-modules:
  web-angular-cache:
